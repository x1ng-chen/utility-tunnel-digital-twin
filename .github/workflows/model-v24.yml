name: Verify V24 model delivery
on:
  pull_request:
    paths: ['model/square-five-station-v24-inset-rgb-fans/**', 'frontend/public/models/utility-tunnel-v24.glb', 'frontend/src/utils/fanMotion*', 'frontend/src/components/TwinScene.vue', 'frontend/src/services/twin3d.ts', 'frontend/src/stores/operations*', 'frontend/src/views/Twin3DView*', 'frontend/src/data/twin-v24-presentation.json', 'backend/operations/agent_catalog/model-v24-presentation.json', 'tools/check-v24-runtime.mjs', 'tools/verify-unified-sensors.mjs', 'model/square-five-station-v24-unified-numbering/**', 'frontend/public/models/utility-tunnel-v24-unified.glb', 'backend/operations/agent_catalog/model-v24-unified-presentation.json', '.github/workflows/model-v24.yml']
  push:
    branches: [main]
    paths: ['model/square-five-station-v24-inset-rgb-fans/**', 'frontend/public/models/utility-tunnel-v24.glb', 'frontend/src/utils/fanMotion*', 'frontend/src/components/TwinScene.vue', 'frontend/src/services/twin3d.ts', 'frontend/src/stores/operations*', 'frontend/src/views/Twin3DView*', 'frontend/src/data/twin-v24-presentation.json', 'backend/operations/agent_catalog/model-v24-presentation.json', 'tools/check-v24-runtime.mjs', 'tools/verify-unified-sensors.mjs', 'model/square-five-station-v24-unified-numbering/**', 'frontend/public/models/utility-tunnel-v24-unified.glb', 'backend/operations/agent_catalog/model-v24-unified-presentation.json', '.github/workflows/model-v24.yml']
permissions:
  contents: read
jobs:
  v24-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {lfs: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Fetch actual V24 delivery and frozen input bytes
        run: git lfs pull --include="model/square-five-station-v24-inset-rgb-fans/**,frontend/public/models/utility-tunnel-v24.glb,model/square-five-station-v24-unified-numbering/**,frontend/public/models/utility-tunnel-v24-unified.glb" --exclude=""
      - name: Verify binary and text hashes
        run: python3 model/square-five-station-v24-inset-rgb-fans/verify_package.py
      - name: Install the existing Three.js dependency
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Inspect actual mesh apertures, axes, identities and lighting independence
        run: |
          node model/square-five-station-v24-inset-rgb-fans/verify_export.mjs
          node model/square-five-station-v24-inset-rgb-fans/integration/verify-fan-motion.mjs
          node tools/check-v24-runtime.mjs
          node tools/verify-unified-sensors.mjs
      - name: Frontend regression with actual V24 file, no hardware or model API
        working-directory: frontend
        env:
          FAN_MODEL_GLB: ${{ github.workspace }}/frontend/public/models/utility-tunnel-v24.glb
        run: npm test -- --reporter=dot
