name: Verify voice assistant

on:
  push:
    paths:
      - 'services/voice-assistant/**'
      - 'backend/operations/ai_assistant.py'
      - 'backend/operations/views.py'
      - '.github/workflows/voice-assistant.yml'
  pull_request:
    paths:
      - 'services/voice-assistant/**'
      - 'backend/operations/ai_assistant.py'
      - 'backend/operations/views.py'
      - '.github/workflows/voice-assistant.yml'
permissions:
  contents: read
jobs:
  voice-tests:
    name: Voice bridge and native streaming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0
          python -m pip install aiohttp==3.14.5 numpy==1.26.4 soxr==1.1.0 opuslib_next==1.3.1
      - name: Require native audio dependencies
        run: python -c "import aiohttp, numpy, soxr, opuslib_next; opuslib_next.Encoder(24000, 1, opuslib_next.APPLICATION_AUDIO)"
      - name: Run isolated voice regression tests
        run: python -B -m unittest discover -s services/voice-assistant/tests -v
