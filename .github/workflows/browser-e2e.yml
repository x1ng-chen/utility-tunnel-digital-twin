name: Browser end-to-end regression

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tools/e2e/**'
      - 'deploy/containers/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'tools/e2e/**'
      - 'deploy/containers/**'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: read

jobs:
  container-build:
    name: Production container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Django API image
        run: docker build --file deploy/containers/Dockerfile.api --tag utility-tunnel-api:ci .
      - name: Build Vue web image
        run: docker build --file deploy/containers/Dockerfile.web --tag utility-tunnel-web:ci .

  browser-e2e:
    name: Vue3 and Django browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install application dependencies
        run: |
          npm ci --prefix frontend
          python -m pip install --require-hashes -r backend/requirements.lock
      - name: Start isolated test services
        shell: bash
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py seed_demo
          # The browser suite intentionally performs many independent login
          # journeys. Keep production's 10/min default untouched, while giving
          # this isolated CI process a test-only allowance.
          LOGIN_RATE_LIMIT=100/min REGISTRATION_RATE_LIMIT=100/hour PASSWORD_SETUP_RATE_LIMIT=100/min python manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django-e2e.log" 2>&1 &
          cd ../frontend
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/vue-e2e.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/ready/ >/dev/null && curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Install temporary browser runner
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ut-playwright" --no-save --no-package-lock @playwright/test@1.55.0
          "$RUNNER_TEMP/ut-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser regression
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/ut-playwright/node_modules
          E2E_WEB_URL: http://127.0.0.1:5173
        run: |
          "$RUNNER_TEMP/ut-playwright/node_modules/.bin/playwright" test --config "$GITHUB_WORKSPACE/tools/e2e/playwright.config.cjs" --reporter=line --timeout=60000
      - name: Upload service logs when a regression fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-logs
          path: |
            ${{ runner.temp }}/django-e2e.log
            ${{ runner.temp }}/vue-e2e.log
          if-no-files-found: ignore
