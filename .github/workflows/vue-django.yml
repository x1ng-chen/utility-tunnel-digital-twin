name: Verify Vue3 and Django stack

on:
  push:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/vue-django-stack.md'
      - 'docs/api-contract.md'
      - 'docs/software-platform.md'
      - 'docs/测试报告.md'
      - 'docs/deployment-runbook.md'
      - 'docs/software-quality-gates.md'
      - 'deploy/postgres/**'
      - 'tools/**'
      - '.github/workflows/vue-django.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/vue-django-stack.md'
      - 'docs/api-contract.md'
      - 'docs/software-platform.md'
      - 'docs/测试报告.md'
      - 'docs/deployment-runbook.md'
      - 'docs/software-quality-gates.md'
      - 'deploy/postgres/**'
      - 'tools/**'
      - '.github/workflows/vue-django.yml'

jobs:
  repository-safety:
    name: Repository safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/quality-scan.mjs

  frontend:
    name: Vue3 quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high

  backend:
    name: Django quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Configure CI settings
        shell: bash
        run: |
          echo "DJANGO_ENV=test" >> "$GITHUB_ENV"
          echo "DJANGO_SECRET_KEY=ci-only-django-secret-that-is-longer-than-thirty-two-characters" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python -m compileall -q config operations
