<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M9 1 L1 5 L9 9" fill="#1f2937"/>
    </marker>
    <style>
      .line { fill:none; stroke:#172033; stroke-width:2.4; }
      .thin { fill:none; stroke:#475569; stroke-width:1.5; }
      .hidden { fill:none; stroke:#64748b; stroke-width:1.5; stroke-dasharray:8 5; }
      .dim { fill:none; stroke:#1f2937; stroke-width:1.4; marker-start:url(#arrow); marker-end:url(#arrow); }
      .ext { fill:none; stroke:#64748b; stroke-width:1.2; }
      .h1 { font:700 34px 'Microsoft YaHei',Arial,sans-serif; fill:#0f2747; }
      .h2 { font:700 23px 'Microsoft YaHei',Arial,sans-serif; fill:#0f2747; }
      .label { font:600 18px 'Microsoft YaHei',Arial,sans-serif; fill:#172033; }
      .note { font:16px 'Microsoft YaHei',Arial,sans-serif; fill:#334155; }
      .dimtext { font:600 17px Arial,'Microsoft YaHei',sans-serif; fill:#172033; }
      .small { font:14px 'Microsoft YaHei',Arial,sans-serif; fill:#475569; }
    </style>
  </defs>

  <rect width="1600" height="1180" fill="#ffffff"/>
  <rect x="35" y="35" width="1530" height="1110" fill="none" stroke="#0f2747" stroke-width="2"/>
  <text x="70" y="88" class="h1">综合管廊数字孪生实体样品 — 三视图</text>
  <text x="70" y="119" class="note">外形冻结尺寸：1000 × 500 × 420 mm　|　单位：mm　|　示意尺寸图，外协加工前须按实物与零件复测复核</text>

  <!-- 主视图 -->
  <text x="70" y="180" class="h2">主视图</text>
  <g>
    <!-- shell and base -->
    <rect x="110" y="238" width="800" height="240" class="line"/>
    <rect x="110" y="414" width="800" height="64" fill="#dbe4ee" stroke="#172033" stroke-width="2.4"/>
    <line x1="190" y1="238" x2="190" y2="414" class="line"/>
    <line x1="390" y1="238" x2="390" y2="414" class="line"/>
    <line x1="630" y1="238" x2="630" y2="414" class="line"/>
    <line x1="830" y1="238" x2="830" y2="414" class="line"/>
    <!-- pipe and equipment -->
    <line x1="170" y1="300" x2="850" y2="300" stroke="#64748b" stroke-width="15"/>
    <line x1="170" y1="355" x2="850" y2="355" stroke="#b45309" stroke-width="12"/>
    <line x1="170" y1="397" x2="850" y2="397" stroke="#334155" stroke-width="8"/>
    <rect x="430" y="383" width="150" height="25" fill="#b7e4f5" stroke="#0369a1" stroke-width="1.5"/>
    <rect x="670" y="425" width="180" height="42" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <!-- labels -->
    <text x="290" y="270" text-anchor="middle" class="label">A区 · 250</text>
    <text x="510" y="270" text-anchor="middle" class="label">B区 · 300</text>
    <text x="730" y="270" text-anchor="middle" class="label">C区 · 350</text>
    <text x="505" y="404" text-anchor="middle" class="small">可拆接水盘</text>
    <text x="760" y="453" text-anchor="middle" class="small">底座内干式电气舱</text>
    <text x="510" y="455" text-anchor="middle" class="label">一体式底座 · 80</text>
    <!-- top overall dimension -->
    <line x1="110" y1="205" x2="910" y2="205" class="dim"/>
    <line x1="110" y1="214" x2="110" y2="233" class="ext"/>
    <line x1="910" y1="214" x2="910" y2="233" class="ext"/>
    <text x="510" y="195" text-anchor="middle" class="dimtext">1000</text>
    <!-- zone dimensions -->
    <line x1="190" y1="515" x2="390" y2="515" class="dim"/>
    <line x1="390" y1="515" x2="630" y2="515" class="dim"/>
    <line x1="630" y1="515" x2="830" y2="515" class="dim"/>
    <line x1="190" y1="482" x2="190" y2="522" class="ext"/>
    <line x1="390" y1="482" x2="390" y2="522" class="ext"/>
    <line x1="630" y1="482" x2="630" y2="522" class="ext"/>
    <line x1="830" y1="482" x2="830" y2="522" class="ext"/>
    <text x="290" y="542" text-anchor="middle" class="dimtext">250</text>
    <text x="510" y="542" text-anchor="middle" class="dimtext">300</text>
    <text x="730" y="542" text-anchor="middle" class="dimtext">350</text>
    <text x="510" y="570" text-anchor="middle" class="note">内部有效长度 900（两端结构余量合计 100）</text>
    <!-- height dimensions -->
    <line x1="952" y1="238" x2="952" y2="478" class="dim"/>
    <line x1="916" y1="238" x2="960" y2="238" class="ext"/>
    <line x1="916" y1="478" x2="960" y2="478" class="ext"/>
    <text x="978" y="361" text-anchor="middle" transform="rotate(-90 978 361)" class="dimtext">420</text>
    <line x1="1000" y1="414" x2="1000" y2="478" class="dim"/>
    <line x1="916" y1="414" x2="1008" y2="414" class="ext"/>
    <line x1="916" y1="478" x2="1008" y2="478" class="ext"/>
    <text x="1026" y="447" text-anchor="middle" transform="rotate(-90 1026 447)" class="dimtext">80</text>
  </g>

  <!-- 俯视图 -->
  <text x="1040" y="180" class="h2">俯视图</text>
  <g>
    <rect x="1050" y="238" width="420" height="336" class="line"/>
    <rect x="1080" y="286" width="360" height="240" class="hidden"/>
    <line x1="1092" y1="238" x2="1092" y2="574" class="line"/>
    <line x1="1197" y1="238" x2="1197" y2="574" class="line"/>
    <line x1="1323" y1="238" x2="1323" y2="574" class="line"/>
    <line x1="1428" y1="238" x2="1428" y2="574" class="line"/>
    <line x1="1090" y1="350" x2="1430" y2="350" stroke="#64748b" stroke-width="13"/>
    <line x1="1090" y1="442" x2="1430" y2="442" stroke="#b45309" stroke-width="10"/>
    <rect x="1209" y="382" width="102" height="86" fill="#b7e4f5" stroke="#0369a1" stroke-width="1.5"/>
    <circle cx="1144" cy="408" r="9" fill="#dc2626"/>
    <circle cx="1260" cy="408" r="9" fill="#dc2626"/>
    <circle cx="1376" cy="408" r="9" fill="#dc2626"/>
    <text x="1144" y="270" text-anchor="middle" class="label">A</text>
    <text x="1260" y="270" text-anchor="middle" class="label">B</text>
    <text x="1376" y="270" text-anchor="middle" class="label">C</text>
    <text x="1260" y="425" text-anchor="middle" class="small">接水盘</text>
    <text x="1260" y="493" text-anchor="middle" class="small">约 280 × 180 × 25</text>
    <line x1="1050" y1="205" x2="1470" y2="205" class="dim"/>
    <line x1="1050" y1="214" x2="1050" y2="233" class="ext"/>
    <line x1="1470" y1="214" x2="1470" y2="233" class="ext"/>
    <text x="1260" y="195" text-anchor="middle" class="dimtext">1000</text>
    <line x1="1507" y1="238" x2="1507" y2="574" class="dim"/>
    <line x1="1476" y1="238" x2="1515" y2="238" class="ext"/>
    <line x1="1476" y1="574" x2="1515" y2="574" class="ext"/>
    <text x="1530" y="406" text-anchor="middle" transform="rotate(-90 1530 406)" class="dimtext">500</text>
    <text x="1260" y="610" text-anchor="middle" class="dimtext">内部有效展示净宽 360</text>
  </g>

  <!-- 左视图 -->
  <text x="70" y="655" class="h2">左视图</text>
  <g>
    <rect x="110" y="710" width="400" height="240" class="line"/>
    <rect x="110" y="886" width="400" height="64" fill="#dbe4ee" stroke="#172033" stroke-width="2.4"/>
    <rect x="166" y="746" width="288" height="140" class="hidden"/>
    <line x1="190" y1="793" x2="430" y2="793" stroke="#64748b" stroke-width="15"/>
    <line x1="190" y1="846" x2="430" y2="846" stroke="#b45309" stroke-width="12"/>
    <line x1="190" y1="870" x2="430" y2="870" stroke="#334155" stroke-width="8"/>
    <text x="310" y="779" text-anchor="middle" class="small">透明罩内有效净空</text>
    <text x="310" y="925" text-anchor="middle" class="label">一体式底座 · 80</text>
    <line x1="110" y1="677" x2="510" y2="677" class="dim"/>
    <line x1="110" y1="686" x2="110" y2="705" class="ext"/>
    <line x1="510" y1="686" x2="510" y2="705" class="ext"/>
    <text x="310" y="667" text-anchor="middle" class="dimtext">500</text>
    <line x1="166" y1="985" x2="454" y2="985" class="dim"/>
    <line x1="166" y1="954" x2="166" y2="992" class="ext"/>
    <line x1="454" y1="954" x2="454" y2="992" class="ext"/>
    <text x="310" y="1013" text-anchor="middle" class="dimtext">内部净宽 360</text>
    <line x1="552" y1="710" x2="552" y2="950" class="dim"/>
    <line x1="516" y1="710" x2="560" y2="710" class="ext"/>
    <line x1="516" y1="950" x2="560" y2="950" class="ext"/>
    <text x="578" y="831" text-anchor="middle" transform="rotate(-90 578 831)" class="dimtext">420</text>
    <line x1="78" y1="746" x2="78" y2="886" class="dim"/>
    <line x1="86" y1="746" x2="160" y2="746" class="ext"/>
    <line x1="86" y1="886" x2="160" y2="886" class="ext"/>
    <text x="55" y="816" text-anchor="middle" transform="rotate(-90 55 816)" class="dimtext">内部净高 300</text>
  </g>

  <!-- notes and title block -->
  <g>
    <rect x="670" y="655" width="795" height="350" fill="#f8fafc" stroke="#0f2747" stroke-width="1.5"/>
    <text x="700" y="695" class="h2">结构与加工说明</text>
    <text x="700" y="734" class="note">1. 总外形：1000 × 500 × 420；内部有效展示空间：900 × 360 × 300。</text>
    <text x="700" y="768" class="note">2. 纵向分区按A/B/C = 250 / 300 / 350布置；两端预留结构与安装余量。</text>
    <text x="700" y="802" class="note">3. 底座：1000 × 500 × 80一体式封闭底座；B区单独设置可拆高边接水盘。</text>
    <text x="700" y="836" class="note">4. 外壳：4 mm透明亚克力罩与观众侧板，分片可拆；边缘倒钝处理。</text>
    <text x="700" y="870" class="note">5. A/C区底座下方设置干式电气舱，可用空间不小于280 × 180 × 70。</text>
    <text x="700" y="904" class="note">6. 加工控制：总装±5；安装孔±0.5；透明板与3D打印件预留1–2装配间隙。</text>
    <text x="700" y="950" class="note">安全边界：模型内部仅12V / 5V / 3.3V直流；220V适配器始终置于模型外部。</text>
    <line x1="670" y1="1030" x2="1465" y2="1030" class="thin"/>
    <line x1="1080" y1="1005" x2="1080" y2="1145" class="thin"/>
    <line x1="1280" y1="1005" x2="1280" y2="1145" class="thin"/>
    <text x="700" y="1060" class="small">项目：综合管廊数字孪生运维实体样品</text>
    <text x="700" y="1090" class="small">图纸：实体样品三视图</text>
    <text x="700" y="1120" class="small">版本：V2.8 · 1m尺寸冻结版</text>
    <text x="1100" y="1060" class="small">比例：示意</text>
    <text x="1100" y="1090" class="small">单位：mm</text>
    <text x="1100" y="1120" class="small">日期：2026-08-28</text>
    <text x="1300" y="1060" class="small">制图：项目组</text>
    <text x="1300" y="1090" class="small">状态：尺寸冻结</text>
    <text x="1300" y="1120" class="small">编号：UT-DWG-001</text>
  </g>
</svg>
