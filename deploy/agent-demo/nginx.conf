server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64m;
  location /api/ { proxy_pass http://api:18927; proxy_set_header Host localhost; proxy_read_timeout 130s; }
  location /ws/ { proxy_pass http://api:18927; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host localhost; }
  location /media/ { proxy_pass http://api:18927; proxy_set_header Host localhost; }
  location / { try_files $uri $uri/ /index.html; }
}
