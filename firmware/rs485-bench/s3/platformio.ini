[env:s3_gateway_bench]
platform = platformio/espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -I../common

[env:s3_gateway_bench_dual]
extends = env:s3_gateway_bench
build_flags =
    ${env:s3_gateway_bench.build_flags}
    -D BENCH_POLL_MASK=12

[env:s3_gateway_bench_quad]
extends = env:s3_gateway_bench
build_flags =
    ${env:s3_gateway_bench.build_flags}
    -D BENCH_POLL_MASK=15
